<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Ring Bisected by Center Bar / Nissan Emblem (Wordmark removed for deduction gameplay) -->
  <defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#9e9e9e"/>
      <stop offset="100%" stop-color="#616161"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#chromeGrad)">
    <!-- Outer Emblem Ring -->
    <circle cx="120" cy="120" r="76" stroke-width="16"/>
    <!-- Inner Ring Accent -->
    <circle cx="120" cy="120" r="64" stroke-width="3" stroke="#b0b0b0"/>
    <!-- Central Bisecting Block -->
    <rect x="25" y="104" width="190" height="32" rx="4" fill="url(#chromeGrad)" stroke="#4a4a4a" stroke-width="2"/>
    <!-- Inner Accent Panel -->
    <rect x="30" y="108" width="180" height="24" rx="2" fill="#c90c41" stroke="none"/>
  </g>
</svg>
